<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Production Tracker</title><style>
:root{--bg:#f2f5f9;--c:#fff;--t:#1b2733;--m:#6b7a89;--a:#0f766e;--b:#e2e8ef;--w:#c2410c;--h:#12304f;--g:#eef7f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--c:#172230;--t:#e6edf3;--m:#8fa1b3;--a:#2dd4bf;--b:#26374a;--w:#fb923c;--h:#0a111b;--g:#12313a}}
:root[data-theme="dark"]{--bg:#0e1620;--c:#172230;--t:#e6edf3;--m:#8fa1b3;--a:#2dd4bf;--b:#26374a;--w:#fb923c;--h:#0a111b;--g:#12313a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--h);color:#fff;padding:12px 14px}header h1{margin:0;font-size:18px}header small{opacity:.7}
nav{display:flex;gap:4px;padding:8px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:3}nav button{flex:1;border:0;background:none;color:var(--m);padding:8px 2px;border-radius:8px;font:600 12px inherit;cursor:pointer}nav button.on{background:var(--a);color:#fff}
main{max-width:1000px;margin:auto;padding:10px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px;overflow-x:auto}.kp b{display:block;font-size:22px;color:var(--a)}.kp span,.m{color:var(--m);font-size:12px}
h2{font-size:14px;margin:0 0 8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--b)}th:first-child,td:first-child{text-align:left}th{color:var(--m)}
.wk td{background:var(--g);font-weight:700}.n{color:var(--w);font-size:10px}.bad{color:var(--w)}.ok{color:var(--a)}
input,select,button.s{font:inherit;padding:6px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}button.s{background:var(--a);color:#fff;border:0;font-weight:700;cursor:pointer}
.er{display:grid;grid-template-columns:70px 1fr 1fr;gap:6px;margin:4px 0;align-items:center}.er input,.er select{width:100%}ul{margin:4px 0;padding-left:18px}li{margin:3px 0}svg{width:100%;height:auto;display:block}
</style></head><body>
<header><button class="s" onclick="unlock()" style="float:right">Edit</button><h1>Production Tracker</h1><small id="st">View only</small></header><nav id="nv"></nav><main id="v"></main>
<script>
let R={},PIN='';const API='https://script.google.com/macros/s/AKfycbzRIzYa2u6bHjuZaQPZUxC3IoJ8pk5rvctCB3TrJ0_eIzT62Ab0qHVfhFpRY0JHoz-NLw/exec',TABS=['Dashboard','Jul','Aug','Sep','Oct','Nov','Dec','Reports'],MO=['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'],MN=['July','August','September','October','November','December'];
const HOL={'2026-09-24':1,'2026-12-16':1,'2026-12-25':1,'2026-12-26':1},NEW=['SAM','JP','XAVIER','DIRK'],REAS=['Maintenance','Housekeeping','Warehouse','Stock take','Bottles','Off-site work','Driver','Leave/Absent','Public holiday','Other'],SUP='DIRK';
let tab=0,rm=MO[2],owner=false,msg='';const $=id=>document.getElementById(id),f=n=>Math.round(n).toLocaleString('en-ZA'),dow=k=>new Date(k+'T00:00:00Z').getUTCDay();
let keys=[],LAST='2026-09-01',FL={},LL={},cm='2026-09';function ix(){keys=Object.keys(R).sort();LAST=keys[keys.length-1]||LAST;FL={};LL={};keys.forEach(k=>{for(const w in R[k]){FL[w]=FL[w]||k;LL[w]=k}});NEW.forEach(w=>LL[w]=LAST);cm=LAST.slice(0,7)}
function dates(ym){const a=[],d=new Date(ym+'-01T00:00:00Z');while(d.toISOString().slice(0,7)==ym){a.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1)}return a.filter(k=>dow(k)!=0)}

function S(ym){const ds=dates(ym),W={},T={},L={};let tot=0,sup=0,abs=0,lost=0,wdT=0,wdN=0,lx=0;
ds.forEach(k=>{const r=R[k];if(!r)return;let dt=0;for(const w in r){const v=r[w];W[w]=W[w]||{u:0,d:0,x:0};if(typeof v=='number'){W[w].u+=v;dt+=v;if(v>0)W[w].d++;if(w==SUP)sup+=v}else{W[w].x++;L[v]=L[v]||{n:0,e:0,w:{}};L[v].n++;L[v].w[w]=(L[v].w[w]||0)+1}}T[k]=dt;tot+=dt;if(dow(k)>0&&dow(k)<6){wdT+=dt;wdN++}});
const A={};for(const w in W)A[w]=W[w].d?W[w].u/W[w].d:0;
for(const r in L)for(const w in L[r].w)if(w!=SUP){const e=L[r].w[w]*(A[w]||0);L[r].e+=e;lost+=e}
ds.forEach(k=>{if(!R[k]||k>LAST||dow(k)<1||dow(k)>5||HOL[k])return;for(const w in FL)if(w!=SUP&&k>=FL[w]&&k<=LL[w]&&R[k][w]===undefined)abs++;});
const rem=ds.filter(k=>k>LAST&&dow(k)>0&&dow(k)<6&&!HOL[k]).length,has=wdN>0,avg=has?wdT/wdN:0,last5=Object.keys(T).filter(k=>dow(k)>0&&dow(k)<6).slice(-5),l5=last5.length?last5.reduce((a,k)=>a+T[k],0)/last5.length:0;
return{ds,W,T,L,tot,sup,abs,lost,rem,avg,l5,has,wdN,A,proj:tot+rem*avg,proj5:tot+rem*l5,done:!rem&&ym<=LAST.slice(0,7)}}
function bars(v,lb,hi,cur){const m=Math.max(...v,1),w=560/v.length;return '<svg viewBox="0 0 580 150">'+v.map((x,i)=>{const h=x/m*105,c=cur&&cur[i];return `<rect x="${10+i*w+w*.12}" y="${125-h}" width="${w*.76}" height="${h}" rx="3" fill="${c?'var(--w)':'var(--a)'}" opacity="${hi&&hi[i]?.45:1}"/><text x="${10+i*w+w/2}" y="${120-h}" font-size="${v.length>15?7:10}" text-anchor="middle" fill="var(--t)">${x?f(x):''}</text><text x="${10+i*w+w/2}" y="142" font-size="${v.length>15?7:10}" text-anchor="middle" fill="var(--m)">${lb[i]}</text>`}).join('')+'</svg>'}
const pv=i=>MO[MO.indexOf(i)-1];
function dash(){const s=S(cm),p=pv(cm)?S(pv(cm)):null,mi=MO.indexOf(cm),ms=MO.slice(0,mi+1).map(S),dv=p?s.tot-p.tot:0;
const tw={};keys.forEach(k=>{for(const w in R[k])if(typeof R[k][w]=='number'){tw[w]=tw[w]||{u:0,d:0};tw[w].u+=R[k][w];if(R[k][w]>0)tw[w].d++}});
const ds=s.ds.filter(k=>s.T[k]!==undefined);
return `<div class="k">${[[MN[mi]+' to date',f(s.tot),'units'],['Projected '+MN[mi],f(s.proj)+(s.rem?'':' (final)'),s.rem?`${s.rem} working day(s) left · range ${f(s.proj5)}–${f(s.proj)}`:'month complete'],['Avg per working day',f(s.avg),'Mon–Fri team total'],['vs '+(p?MN[mi-1]:'—'),p?(dv>=0?'+':'')+f(dv):'—',p?f(p.tot)+' last month (projected gap '+f(s.proj-p.tot)+')':''],['Supervisor assist',f(s.sup),Math.round(s.sup/(s.tot||1)*100)+'% of month']].map(x=>`<div class="card kp"><span>${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
<div class="card"><h2>Monthly output (orange = projected)</h2>${bars(ms.map((x,i)=>i==mi?x.proj:x.tot),MN.slice(0,mi+1).map(x=>x.slice(0,3)),null,ms.map((x,i)=>i==mi&&x.rem>0))}</div>
<div class="card"><h2>Daily output – ${MN[mi]}</h2>${bars(ds.map(k=>s.T[k]),ds.map(k=>+k.slice(8)))}</div>
<div class="card"><h2>${MN[mi]} by person</h2>${wt(s)}</div>
<div class="card"><h2>All data since July</h2><table><tr><th>Person</th><th>Units</th><th>Days</th><th>Avg/day</th></tr>${Object.keys(tw).sort((a,b)=>tw[b].u-tw[a].u).map(w=>`<tr><td>${w}${w==SUP?' (assist)':''}</td><td>${f(tw[w].u)}</td><td>${tw[w].d}</td><td>${f(tw[w].u/tw[w].d)}</td></tr>`).join('')}</table></div>`}
function wt(s){return `<table><tr><th>Person</th><th>Units</th><th>Days</th><th>Avg/day</th><th>Diverted</th></tr>${Object.keys(s.W).sort((a,b)=>s.W[b].u-s.W[a].u).map(w=>{const x=s.W[w];return `<tr><td>${w}${w==SUP?' (assist)':''}</td><td>${f(x.u)}</td><td>${x.d}</td><td>${f(s.A[w])}</td><td>${x.x}</td></tr>`}).join('')}</table>`}
function month(ym){const s=S(ym),ro=ym>='2026-10'?NEW:Object.keys(s.W).sort((a,b)=>(a==SUP)-(b==SUP)||s.W[b].u-s.W[a].u),i=MO.indexOf(ym);let h='';
if(owner){const nx=s.ds.find(k=>k>LAST||!R[k]&&dow(k)>0)||s.ds[0];h+=`<div class="card"><h2>Enter daily production</h2><input type="date" id="dt" value="${nx}" min="${ym}-01" onchange="fill()"><div id="ef"></div><button class="s" onclick="sv()">Save day</button> <span class="m" id="ms">${msg}</span></div>`}
h+=`<div class="k"><div class="card kp"><span>${MN[i]} total</span><b>${f(s.tot)}</b></div><div class="card kp"><span>Avg per working day</span><b>${f(s.avg)}</b></div><div class="card kp"><span>Projected</span><b>${s.has?f(s.proj):'—'}</b></div></div><div class="card"><table><tr><th>Date</th>${ro.map(w=>`<th>${w}</th>`).join('')}<th>Total</th></tr>`;
let wk=0;s.ds.forEach((k,j)=>{const r=R[k]||{},t=s.T[k];wk+=t||0;if(t!==undefined||dow(k)>0&&dow(k)<6&&k<=LAST)h+=`<tr><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow(k)]} ${+k.slice(8)}${HOL[k]?' 🏳':''}</td>${ro.map(w=>`<td>${typeof r[w]=='number'?r[w]:r[w]?`<span class="n">${r[w]}</span>`:'–'}</td>`).join('')}<td><b>${t===undefined?'':f(t)}</b></td></tr>`;
if(dow(k)==6||j==s.ds.length-1){if(wk)h+=`<tr class="wk"><td>Week</td><td colspan="${ro.length}"></td><td>${f(wk)}</td></tr>`;wk=0}});
return h+'</table></div>'}
function fill(){const k=$('dt').value,r=R[k]||{},ym=k.slice(0,7),ro=ym>='2026-10'?NEW:Object.keys(S(ym).W);$('ef').innerHTML=(ro.length?ro:NEW).map(w=>`<div class="er"><b>${w}</b><input type="number" min="0" id="u_${w}" placeholder="units" value="${typeof r[w]=='number'?r[w]:''}"><select id="r_${w}"><option value="">reason (if no units)</option>${REAS.map(x=>`<option${r[w]===x?' selected':''}>${x}</option>`).join('')}</select></div>`).join('')}
async function sv(){const k=$('dt').value;if(!k)return;const o={};document.querySelectorAll('[id^=u_]').forEach(e=>{const w=e.id.slice(2),u=e.value,r=$('r_'+w).value;if(u!=='')o[w]=+u;else if(r)o[w]=r});$('ms').textContent='Saving…';try{const x=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({pin:PIN,date:k,day:o})}),j=await x.json();if(j.error){$('ms').textContent=j.error;if(j.error=='Wrong PIN'){owner=false;PIN=''}return}R=j.data;ix();msg='Saved ✓';draw()}catch(e){$('ms').textContent='Could not save – check connection'}}
function unlock(){const p=prompt('Enter PIN to edit');if(p){PIN=p;owner=true;draw()}}
function rep(ym){const s=S(ym),i=MO.indexOf(ym),p=i?S(MO[i-1]):null,al=MO.map(S).filter(x=>x.has),oa=al.reduce((a,x)=>a+x.avg,0)/(al.length||1),o=`<div class="card"><select onchange="rm=this.value;draw()">${MO.map((m,j)=>`<option value="${m}"${m==ym?' selected':''}>${MN[j]}</option>`).join('')}</select></div>`;
if(!s.has)return o+'<div class="card">No data for this month yet.</div>';
const dv=p&&p.has?(s.avg/p.avg-1)*100:null,lv=s.avg>oa*1.05?['HIGH','ok']:s.avg<oa*.95?['LOW','bad']:['AVERAGE','m'],wds=Object.keys(s.T).filter(k=>dow(k)>0&&dow(k)<6).sort((a,b)=>s.T[b]-s.T[a]),ps=Object.keys(s.W).filter(w=>w!=SUP),ta=ps.reduce((a,w)=>a+s.W[w].u,0)/(ps.reduce((a,w)=>a+s.W[w].d,0)||1),Ls=Object.keys(s.L).sort((a,b)=>s.L[b].e-s.L[a].e),pct=s.lost/(s.tot||1)*100,I=[];
I.push(`Output per working day was <b>${f(s.avg)}</b> – <b class="${lv[1]}">${lv[0]}</b> against the all-month average of ${f(oa)}${dv!==null?` (${dv>=0?'+':''}${dv.toFixed(1)}% vs ${MN[i-1]})`:''}.`);
if(wds.length>2)I.push(`Best day: ${wds[0].slice(8)} (${f(s.T[wds[0]])}). Weakest: ${wds[wds.length-1].slice(8)} (${f(s.T[wds[wds.length-1]])}).`);
if(Ls.length)I.push(`<b>${Object.values(s.L).reduce((a,x)=>a+x.n,0)}</b> person-days went to non-production work, about <b class="bad">${f(s.lost)}</b> units (${pct.toFixed(0)}% of output). Biggest: ${Ls[0]} (${s.L[Ls[0]].n} days ≈ ${f(s.L[Ls[0]].e)} units).`);
if(s.abs)I.push(`<b>${s.abs}</b> weekday(s) with no entry for a worker (absent or not logged) – check attendance.`);
ps.forEach(w=>{const a=s.A[w];if(s.W[w].d>2&&a<ta*.85)I.push(`${w} averaged ${f(a)}/day, below the team's ${f(ta)} – look at training, tools or task allocation.`)});
if(s.sup/(s.tot||1)>.15)I.push(`Supervisor assist made up ${Math.round(s.sup/s.tot*100)}% of output – production relies on extra hands.`);
const low=Object.keys(s.T).filter(k=>dow(k)>0&&dow(k)<6&&s.T[k]<s.avg*.6&&!HOL[k]).map(k=>+k.slice(8));if(low.length)I.push(`Low days (under 60% of average): ${low.join(', ')} – compare with the diversions below.`);
if(s.lost>s.tot*.05)I.push(`<b>Improve:</b> schedule maintenance, housekeeping and stock take on Saturdays or planned slow days; recovering half the diverted days ≈ <b class="ok">+${f(s.lost/2)}</b> units.`);
else I.push('Diversions were small – protect this by planning maintenance ahead.');
return o+`<div class="card"><h2>${MN[i]} report</h2><ul>${I.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h2>Time not on production</h2>${Ls.length?`<table><tr><th>Reason</th><th>Person-days</th><th>Est. units lost</th></tr>${Ls.map(r=>`<tr><td>${r}</td><td>${s.L[r].n}</td><td>${f(s.L[r].e)}</td></tr>`).join('')}</table>`:'None recorded'}</div><div class="card"><h2>By person</h2>${wt(s)}</div>`}
function draw(){$('nv').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');$('v').innerHTML=tab==0?dash():tab==7?rep(rm):month(MO[tab-1]);if(owner&&tab>0&&tab<7)fill();$('st').textContent=owner?'Editing enabled':'View only · data to '+LAST}
async function load(){if(API.startsWith('PASTE')){$('v').innerHTML='<div class="card">Setup needed: paste the web app address into the API line.</div>';return}try{const j=await(await fetch(API)).json();R=j.data||{};ix()}catch(e){$('v').innerHTML='<div class="card">Could not load data. Refresh the page.</div>';return}draw()}
$('v').innerHTML='<div class="card">Loading…</div>';load();setInterval(()=>{if(!owner)load()},60000);
</script></body></html>
